<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Same square outline, different sample correspondence</title>
<desc id="desc">Analytical illustration, not an executed fit. Four-vertex square A starts at zero; five-vertex encoding B starts at one thirty-second along the same bottom edge. Sixty-four perimeter samples have spacing one sixteenth. An integer cyclic shift cannot cancel the half-step offset.</desc>
<rect width="1100" height="600" fill="#fafaf7"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#203038">
<text x="36" y="40" font-size="25" font-weight="700">Identical outlines can have different sample correspondence</text>
<text x="36" y="68" font-size="15" fill="#52616b">Analytical illustration · unit-square perimeter = 4 · 64 samples · no fitter execution</text>
<rect x="28" y="88" width="496" height="328" rx="12" fill="white" stroke="#d5dedc"/>
<rect x="540" y="88" width="532" height="328" rx="12" fill="white" stroke="#d5dedc"/>
<text x="48" y="119" font-size="19" font-weight="700">1. Same boundary; different vertex lists</text>
<text x="48" y="146" font-size="14">Same square and traversal direction in both encodings.</text><text x="72" y="178" font-size="16" font-weight="700" fill="#176b91">A · 4 vertices</text><path d="M80 330 H226 V184 H80 Z" fill="none" stroke="#203038" stroke-width="2"/><circle cx="80" cy="330" r="4" fill="#176b91"/><circle cx="226" cy="330" r="4" fill="#176b91"/><circle cx="226" cy="184" r="4" fill="#176b91"/><circle cx="80" cy="184" r="4" fill="#176b91"/><circle cx="80" cy="330" r="8" fill="none" stroke="#176b91" stroke-width="2"/><circle cx="80" cy="330" r="2" fill="#176b91"/><text x="118" y="356" font-size="19">→</text><text x="68" y="381" font-size="15" fill="#176b91">Start: (0, 0)</text><text x="302" y="178" font-size="16" font-weight="700" fill="#b34e28">B · 5 vertices</text><path d="M310 330 H456 V184 H310 Z" fill="none" stroke="#203038" stroke-width="2"/><circle cx="310" cy="330" r="4" fill="#b34e28"/><circle cx="456" cy="330" r="4" fill="#b34e28"/><circle cx="456" cy="184" r="4" fill="#b34e28"/><circle cx="310" cy="184" r="4" fill="#b34e28"/><circle cx="314.5625" cy="330" r="8" fill="none" stroke="#b34e28" stroke-width="2"/><circle cx="314.5625" cy="330" r="2" fill="#b34e28"/><text x="348" y="356" font-size="19">→</text><text x="298" y="381" font-size="15" fill="#b34e28">Start: (1/32, 0)</text><text x="48" y="405" font-size="12" fill="#52616b">Rings mark starts; dots mark vertices. Marker sizes are illustrative.</text>
<text x="560" y="119" font-size="18" font-weight="700">2. Enlarged grids along the bottom edge</text>
<text x="560" y="146" font-size="14">Same spacing; B starts half a sample step later.</text>
<text x="560" y="193" font-size="15" fill="#176b91">A</text>
<text x="560" y="269" font-size="15" fill="#b34e28">B</text><path d="M606 189 H1022" stroke="#b8c6cb" stroke-width="2"/><circle cx="606" cy="189" r="5" fill="#176b91"/><circle cx="710" cy="189" r="5" fill="#176b91"/><circle cx="814" cy="189" r="5" fill="#176b91"/><circle cx="918" cy="189" r="5" fill="#176b91"/><circle cx="1022" cy="189" r="5" fill="#176b91"/><path d="M606 265 H1022" stroke="#b8c6cb" stroke-width="2"/><circle cx="658" cy="265" r="5" fill="#b34e28"/><circle cx="762" cy="265" r="5" fill="#b34e28"/><circle cx="866" cy="265" r="5" fill="#b34e28"/><circle cx="970" cy="265" r="5" fill="#b34e28"/><path d="M606 168 V160 H710 V168 M606 204 V231 H658 V248" fill="none" stroke="#52616b"/>
<text x="641" y="155" font-size="14">1/16</text>
<text x="672" y="235" font-size="14">1/32 offset = half a step</text><text x="606" y="296" font-size="13" text-anchor="middle">0</text><text x="710" y="296" font-size="13" text-anchor="middle">1/16</text><text x="814" y="296" font-size="13" text-anchor="middle">1/8</text><text x="918" y="296" font-size="13" text-anchor="middle">3/16</text><text x="1022" y="296" font-size="13" text-anchor="middle">1/4</text><text x="560" y="324" font-size="14">Horizontal axis: distance along the bottom edge</text>
<text x="560" y="357" font-size="15" font-weight="700">An integer cyclic shift moves by k × 1/16.</text>
<text x="560" y="383" font-size="15">It cannot cancel an offset of 1/32.</text>
<text x="36" y="452" font-size="17" font-weight="700">The outline is unchanged. The chosen correspondences are not.</text>
<text x="36" y="479" font-size="15">A: (0,0) → (1,0) → (1,1) → (0,1) → close</text>
<text x="36" y="504" font-size="15">B: (1/32,0) → (1,0) → (1,1) → (0,1) → (0,0) → close</text>
<text x="36" y="540" font-size="15">Unequal vertex counts trigger 64-point perimeter resampling in the reviewed fitter.</text>
<text x="36" y="566" font-size="14" fill="#52616b">Keep corresponding vertex counts and order when authoring. No fitted-output or pixel-equivalence claim.</text>
</g></svg>
